name: Android Latest

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-latest
  cancel-in-progress: true

jobs:
  package:
    name: Build signed latest APK
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out build commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build, sign, and verify latest APK
        id: package
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: scripts/ci/package-android.sh latest

      - name: Upload latest build artifact
        uses: actions/upload-artifact@v7
        with:
          name: UbuntuManager-latest-v${{ steps.package.outputs.version_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Publish rolling latest GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: latest
          VERSION_NAME: ${{ steps.package.outputs.version_name }}
        run: |
          set -euo pipefail

          build_commit="$(git rev-parse HEAD)"
          notes_file="$RUNNER_TEMP/android-latest-release-notes.md"

          git tag --force "$RELEASE_TAG" "$build_commit"
          git push origin "refs/tags/$RELEASE_TAG" --force

          {
            printf 'Automatically generated signed ARM64 APK.\n\n'
            printf 'Version: %s\n' "$VERSION_NAME"
            printf 'Commit: %s\n' "$build_commit"
          } > "$notes_file"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              dist/UbuntuManager-latest-arm64-v8a.apk \
              dist/UbuntuManager-latest-arm64-v8a.apk.sha256 \
              --clobber
            gh release edit "$RELEASE_TAG" \
              --title "Ubuntu APK Manager latest ($VERSION_NAME)" \
              --notes-file "$notes_file" \
              --prerelease
          else
            gh release create "$RELEASE_TAG" \
              dist/UbuntuManager-latest-arm64-v8a.apk \
              dist/UbuntuManager-latest-arm64-v8a.apk.sha256 \
              --verify-tag \
              --title "Ubuntu APK Manager latest ($VERSION_NAME)" \
              --notes-file "$notes_file" \
              --prerelease
          fi
