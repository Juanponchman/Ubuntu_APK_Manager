workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never

stages:
  - package

default:
  image:
    name: ghcr.io/cirruslabs/android-sdk:35@sha256:c724009e305b4607157287624033ab97f319af44c244bfc9f73b6293f3bb01b9
  interruptible: true
  before_script:
    - chmod +x gradlew scripts/ci/package-android.sh
  cache:
    key:
      files:
        - gradle/wrapper/gradle-wrapper.properties
        - build.gradle.kts
        - app/build.gradle.kts
    paths:
      - .gradle-ci/caches/
      - .gradle-ci/wrapper/
    policy: pull-push

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle-ci"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

package_latest:
  stage: package
  rules:
    - if: "$CI_COMMIT_BRANCH"
  script:
    - scripts/ci/package-android.sh latest
  artifacts:
    name: "UbuntuManager-latest-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 30 days
    paths:
      - dist/
      - app/build/reports/
    reports:
      junit:
        - app/build/test-results/testDebugUnitTest/*.xml

package_release:
  stage: package
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$/'
  script:
    - scripts/ci/package-android.sh release "$CI_COMMIT_TAG"
  artifacts:
    name: "UbuntuManager-$CI_COMMIT_TAG"
    when: always
    expire_in: 1 year
    paths:
      - dist/
      - app/build/reports/
      - app/build/outputs/mapping/release/mapping.txt
    reports:
      junit:
        - app/build/test-results/testDebugUnitTest/*.xml
